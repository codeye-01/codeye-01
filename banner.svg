<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="codeye-01 — code review specialist">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#11161d"/>
      <stop offset="100%" stop-color="#0b0f14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.75"/>
      <stop offset="55%" stop-color="#3fb950" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>
  <rect width="1200" height="3" fill="url(#accent)" opacity="0.85"/>

  <!-- 左侧：身份 -->
  <g font-family="monospace">
    <text x="72" y="108" font-size="23" fill="#58a6ff" letter-spacing="6" opacity="0.9">CODE REVIEW</text>
    <text x="68" y="184" font-size="76" font-weight="700" fill="#e6edf3">codeye-01</text>
    <text x="73" y="222" font-size="17" fill="#8b949e" letter-spacing="1.5">catch it before it merges</text>
  </g>

  <!-- 右侧：diff 意象 -->
  <g transform="translate(778, 40)">
    <rect width="352" height="180" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <path d="M0 34 H352" stroke="#30363d" stroke-width="1.5"/>
    <circle cx="24" cy="18" r="4.5" fill="#f85149" opacity="0.85"/>
    <circle cx="42" cy="18" r="4.5" fill="#d29922" opacity="0.85"/>
    <circle cx="60" cy="18" r="4.5" fill="#3fb950" opacity="0.85"/>
    <text x="82" y="22.5" font-family="monospace" font-size="12" fill="#8b949e">pull request #1</text>

    <g font-family="monospace" font-size="13">
      <text x="22" y="66" fill="#8b949e">- if (user.isAdmin)</text>
      <text x="22" y="90" fill="#8b949e">-   return true</text>
      <text x="22" y="122" fill="#3fb950">+ checkPermission(ctx, "write")</text>
      <text x="22" y="146" fill="#3fb950">+ if !ok { return forbidden }</text>
    </g>
  </g>

  <rect x="72" y="246" width="1056" height="1" fill="url(#line)"/>
</svg>