<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="codeye-01 — code review specialist">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#11161d"/>
      <stop offset="100%" stop-color="#0b0f14"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#3fb950" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>
  <rect width="1200" height="3" fill="url(#accent)" opacity="0.85"/>

  <!-- 左侧：身份 -->
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">
    <text x="72" y="112" font-size="24" fill="#58a6ff" letter-spacing="6" opacity="0.85">CODE REVIEW</text>
    <text x="68" y="186" font-size="76" font-weight="700" fill="#e6edf3" letter-spacing="-1">codeye-01</text>
    <text x="72" y="222" font-size="19" fill="#8b949e" letter-spacing="2">在合并之前，把问题拦下来</text>
  </g>

  <!-- 右侧：diff 意象 -->
  <g transform="translate(790, 44)">
    <rect width="340" height="172" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="0" y="0" width="340" height="34" rx="10" fill="#1c2129"/>
    <rect x="0" y="24" width="340" height="10" fill="#1c2129"/>
    <circle cx="24" cy="17" r="4.5" fill="#f85149" opacity="0.85"/>
    <circle cx="42" cy="17" r="4.5" fill="#d29922" opacity="0.85"/>
    <circle cx="60" cy="17" r="4.5" fill="#3fb950" opacity="0.85"/>
    <text x="86" y="22" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#8b949e">pull request #1</text>

    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13.5">
      <text x="20" y="66" fill="#8b949e">- if (user.isAdmin) {</text>
      <text x="20" y="90" fill="#8b949e">-   return true</text>
      <text x="20" y="114" fill="#8b949e">- }</text>
      <text x="20" y="142" fill="#3fb950">+ requirePermission(ctx, "write")</text>
      <text x="20" y="162" fill="#3fb950">+ if !ok { return errUnauthorized }</text>
    </g>
    <text x="248" y="90" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#f85149" opacity="0.75">✗ hardcode</text>
    <text x="248" y="160" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#3fb950" opacity="0.75">✓ fixed</text>
  </g>

  <rect x="72" y="248" width="1056" height="1" fill="url(#line)"/>
</svg>